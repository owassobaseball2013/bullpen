<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Bullpen control</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel=stylesheet>
<style>
:root{--bg:#0f1114;--pn:#181b20;--ln:#2a2f37;--red:#d71920;--tx:#eef0f3;--mu:#8b93a1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px Barlow,system-ui,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:2}
header h1{margin:0;font:800 24px 'Barlow Condensed';flex:1}#st{color:var(--mu);font-size:13px}
nav{display:flex;gap:4px;padding:8px 14px;overflow:auto}nav button{flex:none}
button{font:600 15px Barlow;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:12px 14px;cursor:pointer;min-height:44px}
button:active{transform:scale(.97)}button.on,nav button.cur{background:var(--red);border-color:var(--red)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{padding:0 14px 60px;max-width:900px;margin:auto}section{margin:14px 0;padding:14px;background:var(--pn);border:1px solid var(--ln);border-radius:8px}
h2{margin:0 0 10px;font:800 20px 'Barlow Condensed'}.g{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.big{font:800 22px 'Barlow Condensed';min-height:64px}.sc{display:flex;justify-content:space-between;font:800 34px 'Barlow Condensed';padding:4px 0}
label{display:block;color:var(--mu);font-size:13px;margin:6px 0 2px}input,select,textarea{width:100%;background:#0f1114;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:10px;font:15px Barlow}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}.lg{width:44px;height:44px;object-fit:contain;background:#000;border-radius:4px;flex:none}
small{color:var(--mu)}
#prev{display:none;position:sticky;top:66px;z-index:1;margin:8px auto 0;width:calc(100% - 28px);max-width:520px;aspect-ratio:16/9;overflow:hidden;border-radius:8px;border:1px solid var(--ln);background:linear-gradient(135deg,#2b3340,#3d4757 55%,#1f2631)}
#prev iframe{width:1920px;height:1080px;border:0;transform-origin:0 0;position:absolute;left:0;top:0}
input[type=range]{padding:0;height:36px}
</style></head><body>
<header><h1>Bullpen</h1><span id=st>Connecting…</span><button onclick="undo()">Undo</button></header>
<nav id=nav></nav><div id=prev></div><main id=app></main>
<script>
const q=new URLSearchParams(location.search),G=q.get('g')||'main';
let K=q.get('key')||localStorage.bk||'';if(!K)K=prompt('Control key')||'';localStorage.bk=K;
const DS={bar:'#0d0d0f',text:'#ffffff',accent:'#d71920',scoreBg:'#f2f2f2',scoreText:'#111111',inn:'#18181b',font:'Barlow Condensed',radius:6,opacity:100,scale:100,logo:34,pos:'',strip:1,upper:1,shadow:1};
const FONTS=['Barlow Condensed','Oswald','Roboto Condensed','Montserrat','Poppins','Inter','Teko','Rajdhani','Saira Condensed','Exo 2','Chakra Petch','Orbitron','Archivo Narrow','Big Shoulders Display','Bebas Neue','Anton','Russo One','Staatliches','Alfa Slab One','Bungee','Fjalla One'];
const PRE={tnt:{},light:{bar:'#ffffff',text:'#111111',accent:'#1d4ed8',scoreBg:'#111111',scoreText:'#ffffff',inn:'#e8ebf0',radius:4,font:'Montserrat'},navy:{bar:'#0b1f3a',accent:'#f2b705',scoreBg:'#f2b705',scoreText:'#0b1f3a',inn:'#12305a',radius:3,font:'Oswald'},glass:{bar:'#101418',accent:'#0d9488',scoreBg:'#3a4350',scoreText:'#ffffff',inn:'#1b2128',radius:16,opacity:72,font:'Montserrat'}};
const T=(n,a,c)=>({name:n,abbr:a,color:c,logo:''});
let S={away:T('Away','AWY','#c8102e'),home:T('Home','HOM','#0c2340'),runs:{away:[],home:[]},H:{away:0,home:0},E:{away:0,home:0},
 inn:1,top:true,b:0,s:0,o:0,bases:[0,0,0],pc:0,lineup:{away:Array(9).fill(''),home:Array(9).fill('')},spot:{away:0,home:0},
 pitcher:{away:'',home:''},vis:{bug:1,lower:0,lineup:0,box:0},banner:'pitcher',nameMode:'full',lower:{title:'',sub:''},lineupSide:'away',ad:{ch:0,url:'',n:0},style:{...DS},adset:{sound:0,sec:10},sponsor:{logo:'',bug:1},pre:{a:'',h:'',sub:''},brk:{title:'Gameday',note:''}};
const norm=()=>{S.style=Object.assign({},DS,S.style);S.adset=Object.assign({sound:0,sec:10},S.adset);S.sponsor=Object.assign({logo:'',bug:1},S.sponsor);S.pre=Object.assign({a:'',h:'',sub:''},S.pre);S.brk=Object.assign({title:'Gameday',note:''},S.brk);S.vis=Object.assign({bug:1,lower:0,lineup:0,box:0,pre:0,brk:0},S.vis)};norm();
let hist=[],ws,tab='live',ctl=false,got=false;
const TABS={live:'Live',gfx:'Graphics',style:'Style',lineups:'Lineups',teams:'Teams',ads:'Ads'};
const st=t=>document.getElementById('st').textContent=t,ls=(k,d)=>{try{return JSON.parse(localStorage[k])}catch{return d}};
function conn(){ws=new WebSocket((location.protocol=='https:'?'wss':'ws')+'://'+location.host+'/ws?g='+G+'&key='+encodeURIComponent(K));
 ws.onmessage=e=>{const m=JSON.parse(e.data);if('ctl'in m){ctl=m.ctl;st(ctl?'Live · '+G:'Wrong key — add ?key=… to the URL')}
  if(m.state){S=m.state;norm();render()}else if('ctl'in m&&ctl)push()};
 ws.onclose=()=>{st('Reconnecting…');setTimeout(conn,1500)}}
const push=()=>ws.readyState==1&&ws.send(JSON.stringify({state:S}));
function commit(fn){hist.push(JSON.stringify(S));if(hist.length>60)hist.shift();fn();push();render()}
function undo(){if(hist.length){S=JSON.parse(hist.pop());push();render()}}
const bat=()=>S.top?'away':'home',fld=()=>S.top?'home':'away',sum=a=>a.reduce((x,y)=>x+(y||0),0);
function run(n,s=bat()){const i=S.inn-1;while(S.runs[s].length<=i)S.runs[s].push(0);S.runs[s][i]=Math.max(0,S.runs[s][i]+n)}
function nb(d=1){S.b=S.s=0;S.spot[bat()]=(S.spot[bat()]+d+9)%9}
function half(){S.o=S.b=S.s=0;S.bases=[0,0,0];S.pc=0;if(S.top)S.top=false;else{S.top=true;S.inn++}}
function out(){S.o++;nb();if(S.o>=3)half()}
function walk(){const b=S.bases;if(b[0]){if(b[1]){if(b[2])run(1);b[2]=1}b[1]=1}b[0]=1}
const A={ball(){S.pc++;if(++S.b>=4){walk();nb()}},strike(){S.pc++;if(++S.s>=3)out()},foul(){S.pc++;if(S.s<2)S.s++},
 inplay(){S.pc++;out()},hit(){S.pc++;S.H[bat()]++;nb()},run,nb,half,
 base(i){S.bases[i]^=1},cnt(k,n){S[k]=Math.max(0,Math.min(k=='b'?3:2,S[k]+n))},outs(n){S.o=Math.max(0,Math.min(2,S.o+n))},
 inn(n){S.inn=Math.max(1,S.inn+n)},err(s){S.E[s]++},hs(s,n){S.H[s]=Math.max(0,S.H[s]+n)},pc(n){S.pc=Math.max(0,S.pc+n)},
 clear(){S.bases=[0,0,0];S.b=S.s=0}};
const act=(n,...a)=>commit(()=>A[n](...a));
function set(p,v){commit(()=>{const k=p.split('.');let o=S;k.slice(0,-1).forEach(x=>o=o[x]);o[k.pop()]=v})}
const tg=p=>{const k=p.split('.');let o=S;k.forEach(x=>o=o[x]);set(p,o?0:1)};
const inp=(l,p,v)=>`<label>${l}</label><input value="${(v??'').toString().replace(/"/g,'&quot;')}" onchange="set('${p}',this.value)">`;
const B=(l,f,c='')=>`<button class="${c}" onclick="${f}">${l}</button>`;
function ss(k,v){S.style[k]=v;push()}
function fit(){const p=document.getElementById('prev'),f=p.firstChild;if(f)f.style.transform='scale('+p.clientWidth/1920+')'}
function logoUp(s,el,m=160){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,m/Math.max(i.width,i.height));c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);set(s+'.logo',c.toDataURL('image/png'))};i.src=r.result};r.readAsDataURL(f)}
function saveTeam(s){const l=ls('bk_teams',[]),t=JSON.parse(JSON.stringify(S[s])),i=l.findIndex(x=>x.name==t.name);i<0?l.push(t):l[i]=t;localStorage.bk_teams=JSON.stringify(l);render()}
function useTeam(i,s){commit(()=>S[s]=ls('bk_teams',[])[i])}
function delTeam(i){const l=ls('bk_teams',[]);l.splice(i,1);localStorage.bk_teams=JSON.stringify(l);render()}
function saveAds(){localStorage.bk_ads=JSON.stringify({1:v('ad1'),2:v('ad2')})}
const v=i=>document.getElementById(i).value.split('\n').map(x=>x.trim()).filter(Boolean),adi={1:0,2:0};
function playAd(c){saveAds();const l=ls('bk_ads',{})[c]||[];if(!l.length)return;const u=l[adi[c]++%l.length];commit(()=>S.ad={ch:c,url:u,n:Date.now()})}
const views={
live(){const bt=bat(),P=(s)=>`${S[s].abbr} ${sum(S.runs[s])}`;
 return `<section><div class=sc><span>${P('away')}</span><span>${S.top?'▲':'▼'} ${S.inn}</span><span>${P('home')}</span></div>
 <small>Batting: ${S[bt].name} · ${S.lineup[bt][S.spot[bt]]||'—'} · Pitching: ${S.pitcher[fld()]||'—'} (${S.pc})</small></section>
 <section><h2>Pitch</h2><div class=g>${B('Ball','act(\'ball\')','big')}${B('Strike','act(\'strike\')','big')}${B('Foul','act(\'foul\')','big')}${B('Out in play','act(\'inplay\')','big')}${B('Hit','act(\'hit\')','big')}${B('Run +1','act(\'run\',1)','big')}</div>
 <p><small>Count ${S.b}-${S.s}, ${S.o} out. Walks, strikeouts and three outs advance on their own.</small></p></section>
 <section><h2>Bases</h2><div class=g>${['1st','2nd','3rd'].map((n,i)=>B(n,`act('base',${i})`,S.bases[i]?'on big':'big')).join('')}${B('Clear','act(\'clear\')','big')}</div></section>
 <section><h2>Adjust</h2><div class=g>${B('Ball −','act(\'cnt\',\'b\',-1)')}${B('Strike −','act(\'cnt\',\'s\',-1)')}${B('Out +','act(\'outs\',1)')}${B('Out −','act(\'outs\',-1)')}${B('Next batter','act(\'nb\')')}${B('Prev batter','act(\'nb\',-1)')}
 ${B('Flip half','act(\'half\')')}${B('Inning −','act(\'inn\',-1)')}${B('Inning +','act(\'inn\',1)')}${B('Run −1','act(\'run\',-1)')}${B('Pitches +','act(\'pc\',1)')}${B('Pitches −','act(\'pc\',-1)')}</div>
 <label>Pitching: ${S[fld()].name}</label><div class=r><input value="${S.pitcher[fld()]}" onchange="set('pitcher.${fld()}',this.value);act('pc',-S.pc)"></div></section>
 <section><h2>Hits and errors</h2><div class=g>${['away','home'].map(s=>`${B(S[s].abbr+' H +','act(\'hs\',\''+s+'\',1)')}${B(S[s].abbr+' H −','act(\'hs\',\''+s+'\',-1)')}${B(S[s].abbr+' E +','act(\'err\',\''+s+'\')')}`).join('')}</div>
 <small>H ${S.H.away}-${S.H.home} · E ${S.E.away}-${S.E.home}</small></section>
 <section><h2>On air</h2><div class=g>${B('Scorebug','tg(\'vis.bug\')',S.vis.bug?'on big':'big')}${['pitcher','batter','off'].map(m=>B('Banner: '+m,`set('banner','${m}')`,S.banner==m?'on':'')).join('')}</div></section>`},
gfx(){return `<section><h2>On air</h2><div class=g>${B('Scorebug','tg(\'vis.bug\')',S.vis.bug?'on big':'big')}${B('Lower third','tg(\'vis.lower\')',S.vis.lower?'on big':'big')}${B('Lineup','tg(\'vis.lineup\')',S.vis.lineup?'on big':'big')}${B('Box score','tg(\'vis.box\')',S.vis.box?'on big':'big')}${B('Pregame matchup','tg(\'vis.pre\')',S.vis.pre?'on big':'big')}${B('Inning break','tg(\'vis.brk\')',S.vis.brk?'on big':'big')}</div></section>
 <section><h2>Lower third</h2>${inp('Title','lower.title',S.lower.title)}${inp('Subtitle','lower.sub',S.lower.sub)}
 <div class=g style="margin-top:8px">${B('Batter card','commit(()=>S.lower={title:S.lineup[bat()][S.spot[bat()]],sub:S[bat()].name+\' · At bat\'})')}${B('Pitcher card','commit(()=>S.lower={title:S.pitcher[fld()],sub:S[fld()].name+\' · \'+S.pc+\' pitches\'})')}</div></section>
 <section><h2>Sponsor logo</h2><div class=r>${S.sponsor.logo?`<img class=lg src="${S.sponsor.logo}">`:''}<input type=file accept="image/*" onchange="logoUp('sponsor',this,400)"></div>
 <div class=g style="margin-top:8px">${B('Show on scorebug','tg(\'sponsor.bug\')',S.sponsor.bug?'on':'')}${B('Remove logo','set(\'sponsor.logo\',\'\')')}</div><small>The logo also appears on the pregame and inning break graphics.</small></section>
 <section><h2>Pregame matchup</h2>${inp('Away record','pre.a',S.pre.a)}${inp('Home record','pre.h',S.pre.h)}${inp('Bottom line, such as the venue','pre.sub',S.pre.sub)}</section>
 <section><h2>Inning break</h2>${inp('Title','brk.title',S.brk.title)}${inp('Bottom line (blank shows the pitcher)','brk.note',S.brk.note)}<small>Shows the upcoming half-inning, scores, hits and errors.</small></section>
 <section><h2>Lineup graphic</h2><div class=g>${['away','home'].map(s=>B(S[s].name,`set('lineupSide','${s}')`,S.lineupSide==s?'on':'')).join('')}</div></section>
 <section><h2>Team names on the bug</h2><div class=g>${B('Full name','set(\'nameMode\',\'full\')',S.nameMode=='full'?'on':'')}${B('Abbreviation','set(\'nameMode\',\'abbr\')',S.nameMode=='abbr'?'on':'')}</div></section>
 <section><h2>URLs</h2><small>Add as a browser source (1920×1080):<br>${location.origin}/overlay.html?g=${G}<br>Options: &amp;scale=1.2 &amp;pos=tr|bl|br</small></section>`},
style(){const s=S.style,col=(l,k)=>`<div><label>${l}</label><input type=color value="${s[k]}" oninput="ss('${k}',this.value)" style="height:44px;padding:2px"></div>`,
 rng=(l,k,a,b)=>`<label>${l}: ${s[k]}</label><input type=range min=${a} max=${b} value="${s[k]}" oninput="ss('${k}',+this.value);this.previousElementSibling.textContent='${l}: '+this.value">`,
 tgb=(l,k)=>B(l,`tg('style.${k}')`,s[k]?'on':'');
 return `<section><h2>Presets</h2><div class=g>${[['tnt','Broadcast red'],['light','Clean white'],['navy','Navy and gold'],['glass','Glass']].map(([k,n])=>B(n,`commit(()=>S.style={...DS,...PRE['${k}']})`)).join('')}</div></section>
 <section><h2>Colors</h2><div class=g>${col('Bar background','bar')}${col('Text','text')}${col('Accent: banner, lower third','accent')}${col('Score box','scoreBg')}${col('Score numbers','scoreText')}${col('Inning box','inn')}</div>
 <small>Team colors come from the Teams tab.</small></section>
 <section><h2>Shape and size</h2>${rng('Overall size %','scale',50,200)}${rng('Bar opacity %','opacity',20,100)}${rng('Corner roundness','radius',0,24)}${rng('Logo size','logo',20,60)}
 <label>Font</label><select onchange="set('style.font',this.value)">${[...new Set([...FONTS,s.font])].map(f=>`<option ${f==s.font?'selected':''}>${f}</option>`).join('')}</select><label>Any other Google Font (type its exact name)</label><input placeholder="e.g. Black Ops One" onchange="if(this.value.trim())set('style.font',this.value.trim())"></section>
 <section><h2>Details</h2><div class=g>${tgb('Team color strip','strip')}${tgb('Uppercase names','upper')}${tgb('Drop shadow','shadow')}</div></section>
 <section><h2>Position</h2><div class=g>${[['','From link'],['tl','Top left'],['tr','Top right'],['bl','Bottom left'],['br','Bottom right']].map(([k,n])=>B(n,`set('style.pos','${k}')`,s.pos==k?'on':'')).join('')}</div></section>`},
lineups(){return ['away','home'].map(s=>`<section><h2>${S[s].name}</h2>${S.lineup[s].map((n,i)=>inp('Batting '+(i+1),`lineup.${s}.${i}`,n)).join('')}${inp('Starting pitcher','pitcher.'+s,S.pitcher[s])}</section>`).join('')},
teams(){const l=ls('bk_teams',[]);return ['away','home'].map(s=>{const t=S[s];return `<section><h2>${s=='away'?'Away':'Home'} team</h2><div class=r>${t.logo?`<img class=lg src="${t.logo}">`:''}<input type=file accept="image/*" onchange="logoUp('${s}',this)"></div>
 ${inp('Name',s+'.name',t.name)}${inp('Abbreviation',s+'.abbr',t.abbr)}<label>Color</label><input type=color value="${t.color}" onchange="set('${s}.color',this.value)" style="height:44px;padding:2px">
 <p>${B('Save to My Teams',`saveTeam('${s}')`)}</p></section>`}).join('')+`<section><h2>My Teams</h2>${l.length?l.map((t,i)=>`<div class=r style="margin:6px 0">${t.logo?`<img class=lg src="${t.logo}">`:''}<b>${t.name}</b>${B('Away',`useTeam(${i},'away')`)}${B('Home',`useTeam(${i},'home')`)}${B('Delete',`delTeam(${i})`)}</div>`).join(''):'<small>Save a team above to reuse it in any game.</small>'}</section>`},
ads(){const a=ls('bk_ads',{});return `<section><h2>Ad settings</h2><div class=g>${B('Sound: '+(S.adset.sound?'on':'off'),'tg(\'adset.sound\')',S.adset.sound?'on':'')}</div><label>Image ads stay up for this many seconds (0 = until Stop)</label><input type=number min=0 value="${S.adset.sec}" onchange="set('adset.sec',+this.value)"><p><small>Video ads clear themselves when they finish. The preview is always muted. In OBS, tick "Control audio via OBS" on the browser source to hear and mix the sound.</small></p></section>`+[1,2].map(c=>`<section><h2>Channel ${c} · ${c==1?'full screen':'corner'}</h2><label>Image or video URLs, one per line (Dropbox links work with ?raw=1)</label><textarea id=ad${c} rows=5 onchange="saveAds()">${(a[c]||[]).join('\n')}</textarea>
 <div class=g style="margin-top:8px">${B('Play next',`playAd(${c})`,S.ad.ch==c?'on':'')}${B('Stop','commit(()=>S.ad={ch:0,url:\'\',n:0})')}</div></section>`).join('')}};
function render(){if(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.type!='file'&&document.activeElement.type!='color'&&false)return;
 document.getElementById('nav').innerHTML=Object.entries(TABS).map(([k,n])=>`<button class="${k==tab?'cur':''}" onclick="tab='${k}';render()">${n}</button>`).join('');
 document.getElementById('app').innerHTML=views[tab]();
 const p=document.getElementById('prev');p.style.display=(tab=='style'||tab=='gfx')?'block':'none';if(!p.firstChild){p.innerHTML='<iframe title=Preview src="/overlay.html?preview=1&g='+G+'"></iframe>'}fit()}
onresize=fit;
render();conn();
</script></body></html>
